[build-system]
requires = ["setuptools>=65.0.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eimutils-snowflake"
version = "1.0.0"
description = "Snowflake-native implementation of EIM utilities using Snowpark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Frank Fortunato"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
keywords = ["snowflake", "snowpark", "etl", "logging", "data-engineering"]

# No dependencies in wheel - Snowflake provides snowpark
dependencies = []

[project.optional-dependencies]
dev = [
    "snowflake-snowpark-python>=1.0.0",
    "snowflake-connector-python>=3.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/eim_deutils"
Repository = "https://github.com/yourusername/eim_deutils.git"
Documentation = "https://github.com/yourusername/eim_deutils/tree/main/python_snowflake"

[tool.setuptools]
packages = ["eimutils_snowflake"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

