[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11",
]
build-backend = "setuptools.build_meta"

[project]
name = "eimutils"
version = "1.10.0"
description = "This project is a wrapper library to call data engineering utility functions."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    {name = "Frank Fortunato"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
keywords = ["etl", "data", "utilities", "snowflake", "aws", "logging"]
dependencies = [
    "boto3",
    "cryptography", # >=46.0.6",
    # Glue (Python 3.9/3.10): pandas 2.x pulls numpy 2.x which breaks awswrangler 2.x pre-installed in Glue
    "pandas",
    # "pandas<2.0.0; python_version < '3.11'",
    # "pandas>=2.0.0; python_version >= '3.11'",
    "pyjwt>=2.12.0",
    # Glue (Python 3.9/3.10): redshift-connector 2.0.907 pre-installed in Glue requires pytz<2022.2
    "pytz<2022.2; python_version < '3.11'",
    "pytz; python_version >= '3.11'",
    "requests", # >=2.33.0",
    "usaddress",
    # Glue (Python 3.9/3.10): pin <3.0.0 which vendors urllib3 v1 (OpenSSL 1.0.2k compatible)
    "snowflake-connector-python>=2.7.0,<3.0.0; python_version < '3.11'",
    # Pipeline/local dev (Python 3.11+): use modern connector (has pre-built wheels)
    "snowflake-connector-python>=3.0.0; python_version >= '3.11'",
    # Glue needs urllib3 v1 pinned for non-vendored usage (requests, boto3, etc.)
    "urllib3>=1.21.1,<2.0.0; python_version < '3.11'",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0"
]
# Development with build tools for Windows/problematic dependencies  
build = [
    "wheel>=0.40.0",
    "build>=0.10.0"
]

# AWS Glue compatible versions (pinned to avoid conflicts with pre-installed packages)

[project.urls]
Homepage = "https://kaena1.atlassian.net/wiki/spaces/EIM/pages/3109683221/eim_deutils"
Documentation = "https://kaena1.atlassian.net/wiki/spaces/EIM/pages/3109683221/eim_deutils"

[tool.setuptools]
packages = ["eimutils"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.sql"]

#[tool.setuptools.packages.find]
#include = ["eimutils*"]
#exclude = ["tests*", "test_*", "build*", "dist*", "*.egg-info*"]

[tool.setuptools.dynamic]
version = {attr = "eimutils.__version__"}

# Pip configuration for binary installations across all environments
# Installation notes for different environments
[tool.eimutils.install]
local = "pip install -e ."
glue = "pip install --only-binary=:all: eimutils"
dbt = "pip install --only-binary=:all: eimutils"
notes = """

"""

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]