[flake8]
max-line-length = 120
# E203: whitespace before ':' — Black formats slices this way
# W503: line break before binary operator — Black prefers this style
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    .venv_snow,
    build,
    dist,
    *.egg-info,
    .mypy_cache

[isort]
profile = black
line_length = 120
known_first_party = eimutils
skip_glob =
    .venv,
    .venv_snow,
    build,
    dist

[coverage:run]
source = eimutils
omit = eimutils/tests/*

[coverage:report]
show_missing = true
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
